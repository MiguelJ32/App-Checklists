name: Compilar BuscadorCL Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pandas openpyxl pypdf pywin32 pymupdf pillow pyinstaller

    - name: Compilar ejecutable con PyInstaller
      run: |
        pyinstaller --noconsole --onefile --clean `
          --exclude-module matplotlib `
          --exclude-module scipy `
          --collect-data customtkinter `
          --name "BuscadorCL" BuscadorCL.py

    - name: Subir ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: BuscadorCL-Windows
        path: dist/BuscadorCL.exe
